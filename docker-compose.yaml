# The production-shaped Compose runtime — ONE SITE'S application tier.
#
# This is the SECOND runtime for the store, not a second environment. It runs
# the same image built from build/Dockerfile, reads the same configuration
# files and the same generated credentials, and mounts the same nginx and
# Varnish configs the cluster mounts. Anything that differs between the two
# runtimes is therefore a property of the runtime rather than of the
# application, which is the only reason having two is worth the cost.
#
# THE DATA TIER IS NOT IN THIS FILE. It is docker-compose.data.yaml, started as
# its own project, and this one joins it over the `data` network at the bottom.
# That is what makes a second store cost 1.46 GiB instead of 3.22 — the
# measurements are in that file's header. Everything here is per site: three
# PHP pools, three nginx pools, Varnish, the cron loop, six consumers, a mail
# sink, and the two volumes that hold this site's media and static content.
#
# NOTHING IN THIS FILE NAMES A SITE. The project name, the hostname, the config
# files, the secrets directory and the data network are all interpolated, and
# every one of them is set by scripts/lib.sh from a single SITE variable. Run
# it through make — `docker compose -f docker-compose.yaml` on its own will
# fail on the `:?` guards rather than start something half-configured.
#
# THE SERVICE NAMES ARE A CONTRACT. Every one of them matches the Kubernetes
# Service of the same job, because Service DNS is what the shared config
# resolves: the Varnish VCL names `web`, `web-admin` and `web-cron` as
# backends, the nginx template resolves ${FASTCGI_BACKEND}, and
# magento-entrypoint defaults to `db`, `opensearch`, `rabbitmq`,
# `valkey-cache` and `valkey-session`. Rename a service here and one of those
# files has to fork. It is also what lets the data tier move to another project
# without a single downstream change: `db` still resolves to `db`.
#
# Production posture, matching the prod-shaped overlay rather than the dev one:
# no source bind-mount, read-only root filesystems, all capabilities dropped,
# every writable path declared. A component that quietly writes into the code
# tree fails loudly instead of working until the container is replaced.
#
#   make compose-up SITE=second.test        bring one site up
#   make compose-install SITE=second.test   install or upgrade its store
#   make compose-down SITE=second.test      stop it, keeping its data
#   make new-site SITE=second.test          all of the above, from nothing
#
# IT PUBLISHES NO PORT. The edge is reached through the shared nginx-proxy on
# 172.17.0.1, where dnsmasq already sends every *.test name — which is exactly
# what keeps it off 127.0.0.1:80 where the kind cluster binds, and what lets
# any number of sites answer on their own hostnames at once. The cluster can
# hold only one, and that is the asymmetry: multi-site is a Compose feature.
name: ${SITE_SLUG:-vanilla-test}

# --- shared fragments --------------------------------------------------------
# The application image, built once and used by every PHP service. `build` is
# repeated by anchor rather than by `depends_on` so that a single
# `docker compose build` covers them all and no service can silently run an
# older image than its neighbour.
x-app-image: &app-image
  image: magento-app:${APP_IMAGE_TAG:-local}
  build:
    context: ./build
    dockerfile: Dockerfile
    target: runtime
    additional_contexts:
      magento-src: ${MAGENTO_SRC:-../commerce-vanilla}

x-app-env: &app-env
  env_file:
    # THE ORDER IS THE PRECEDENCE and it is not cosmetic: Compose applies these
    # in sequence and a later file wins, which is how a site overrides the
    # handful of values it cannot share. kustomize's configMapGenerator merges
    # its `envs:` list the same way, so the two runtimes agree by construction
    # rather than by anyone remembering.
    #
    # Both live under k8s/base because kustomize refuses to read a file outside
    # its own root -- see common.env's header. Compose can read any path, so
    # Compose is the one that reaches across.
    - ${COMMON_ENV_FILE:?set by scripts/lib.sh - run this through make}
    - ${SITE_ENV_FILE:?set by scripts/lib.sh - run this through make}
    # Generated by scripts/secrets.sh into this site's own directory,
    # gitignored, never committed. `make compose-up` regenerates it before
    # starting anything, so a fresh clone does not need this file to exist.
    - ${SECRETS_DIR:?set by scripts/lib.sh - run this through make}/compose-app.env

# Everything a PHP container needs to be read-only and still work.
#
# /etc/magento IS PER-CONTAINER AND MUST STAY THAT WAY. It holds the env.php
# magento-entrypoint generates at start, and the manifests make it a pod-local
# emptyDir for the same reason. It was briefly a SHARED named volume here, and
# the failure was instructive: every container writes that one file on every
# start, so the last container to start decides what all of them read -- and
# consumers restart constantly by design, because they exit after
# --max-messages. A container still running an older image therefore reverts
# env.php for the whole stack, repeatedly, and nothing reports it. The symptom
# was a configuration change that had been rebuilt, redeployed and verified
# present in the image, and was still absent at runtime.
x-app-hardening: &app-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  tmpfs:
    - /tmp:mode=1777
    - /run
    - /etc/magento:mode=0770,uid=1001,gid=1001
  # The data tier is a DIFFERENT COMPOSE PROJECT now, and depends_on cannot
  # reach across one. The ordering it used to express did not disappear: it
  # moved into scripts/site.sh, which brings the data project up with --wait
  # and only then starts an application tier. That is the same two-step split
  # compose-up.sh already made for its own reasons, and the same one
  # scripts/deploy.sh makes for the cluster.
  #
  # Nothing is left to luck by the move. magento-install retries an unreachable
  # database for DB_WAIT_SECONDS and then FAILS rather than treating it as an
  # empty one, which is the case that actually mattered.
  networks: [default, data]
  depends_on:
    stage-media:
      condition: service_completed_successfully

x-app-volumes: &app-volumes
  # An ANONYMOUS volume, so each container gets its own — the Compose
  # equivalent of the pod-local emptyDir in the manifests. Disk-backed rather
  # than tmpfs, so a large var/report cannot eat RAM. Sharing it would mean
  # every pool writing one var/log and taking locks against each other, which
  # is not what either runtime should do.
  - /app/var
  # pub/media is the one writable application path that genuinely has to be
  # shared, so it is the one named volume here.
  - media:/app/pub/media

# A consumer. Six of them differ only by queue name, and that name has to match
# MAGENTO_CONSUMERS in the shared env file -- `make verify-consumers` is what
# checks it, because nothing else will.
x-consumer: &consumer
  <<: [*app-image, *app-env, *app-hardening]
  volumes: *app-volumes
  mem_limit: 1g

services:

  # =========================================================================
  # Application tier
  # =========================================================================

  # Populates the static-content volume from the application image, once, so
  # nginx has something to serve. This is the Compose equivalent of the
  # stage-static init container in web-pools.yaml, and it exists for the same
  # reason: with the code inside an image, an nginx container has no
  # application tree at all.
  stage-static:
    <<: *app-image
    restart: "no"
    user: root
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /pub/static /pub/errors
        cp -a /app/pub/static/. /pub/static/ 2>/dev/null || true
        cp -a /app/pub/errors/. /pub/errors/ 2>/dev/null || true
        # index.php, get.php and static.php are never EXECUTED by nginx -- the
        # FastCGI pass sends SCRIPT_FILENAME to php-fpm, which resolves it
        # against its own /app. They are copied because try_files tests that
        # they exist before passing.
        for f in index.php get.php static.php health_check.php; do
          cp -a "/app/pub/$$f" /pub/ 2>/dev/null || true
        done
        chown -R 1001:1001 /pub
        echo "staged $$(du -sh /pub 2>/dev/null | cut -f1) of static content"
    entrypoint: [""]
    volumes:
      - pub-static:/pub

  # Seeds the media volume from the image, once, the same way stage-static seeds
  # the static one -- and for a reason that is easy to miss.
  #
  # magento/sample-data-media is a `magento2-component` package, so Composer
  # installs its 765 images into the SOURCE TREE's pub/media. They are therefore
  # inside the image at /app/pub/media, 82 MB of them. And then the media volume
  # is mounted over exactly that path at runtime and hides every one.
  #
  # The failure is silent and looks like success: Magento's get.php answers a
  # missing image with the placeholder and HTTP 200, so the catalogue renders,
  # every request succeeds, and every product picture is a 1.7 KB grey square.
  #
  # It mounts the volume somewhere ELSE on purpose -- mounting it at
  # /app/pub/media here would hide the very files this exists to copy.
  stage-media:
    <<: *app-image
    restart: "no"
    user: root
    entrypoint: [""]
    command:
      - sh
      - -c
      - |
        set -eu
        before=$$(find /media-out -type f 2>/dev/null | wc -l)
        # -n never clobbers: an image uploaded through admin outlives every
        # restart, and this stays safe to run on every `up`.
        cp -an /app/pub/media/. /media-out/ 2>/dev/null || true
        chown -R 1001:1001 /media-out
        after=$$(find /media-out -type f 2>/dev/null | wc -l)
        echo "media: $$before files before, $$after after ($$((after - before)) seeded from the image)"
    volumes:
      - media:/media-out

  php-fpm:
    <<: [*app-image, *app-env, *app-hardening]
    volumes: *app-volumes
    healthcheck:
      # A real FastCGI request through cgi-fcgi, not a TCP check on 9000. The
      # difference is between "the listener is bound" and "the pool can execute
      # PHP", and only the second is worth gating a web container on.
      test: ["CMD", "fpm-ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 1g

  php-admin:
    <<: [*app-image, *app-env, *app-hardening]
    volumes: *app-volumes
    healthcheck:
      test: ["CMD", "fpm-ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 1g

  php-cron:
    # The background pool. `make compose-cli` runs here rather than in php-fpm
    # so a reindex does not compete for memory with a container that is also
    # serving storefront traffic.
    <<: [*app-image, *app-env, *app-hardening]
    volumes: *app-volumes
    healthcheck:
      test: ["CMD", "fpm-ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 4g

  web: &web
    image: nginx:1.28.0
    environment:
      FASTCGI_BACKEND: php-fpm
      # Restrict envsubst to FASTCGI_BACKEND so nginx's own $$variables survive
      # the template pass. Without the filter the whole config is rendered
      # against the environment and every $$uri becomes empty.
      NGINX_ENVSUBST_FILTER: FASTCGI_BACKEND
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      # The identical files the cluster mounts from ConfigMaps.
      - ./k8s/base/config/files/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./k8s/base/config/files/nginx/magento.conf:/etc/nginx/magento.conf:ro
      - ./k8s/base/config/files/nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      - pub-static:/app/pub
      - media:/app/pub/media
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # /etc/nginx/conf.d is NOT optional and its absence does not fail loudly.
      # The image's entrypoint renders /etc/nginx/templates into it with
      # envsubst; on a read-only root that step prints
      #
      #   ERROR: /etc/nginx/templates exists, but /etc/nginx/conf.d is not writable
      #
      # and then nginx STARTS ANYWAY, serving the stock default.conf on port 80
      # with no 8080 listener at all. Healthy-looking process, no site. Mounting
      # a tmpfs here also hides that default.conf, which is what we want: the
      # only server block should be the rendered one.
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      # /nginx-health, answered without touching PHP. Probing through to PHP
      # would take every web container unhealthy the moment php-fpm restarted,
      # which is the coupling this design removes.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      stage-static:
        condition: service_completed_successfully
      php-fpm:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  web-admin:
    <<: *web
    environment:
      FASTCGI_BACKEND: php-admin
      NGINX_ENVSUBST_FILTER: FASTCGI_BACKEND
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    depends_on:
      stage-static:
        condition: service_completed_successfully
      php-admin:
        condition: service_healthy

  web-cron:
    <<: *web
    environment:
      FASTCGI_BACKEND: php-cron
      NGINX_ENVSUBST_FILTER: FASTCGI_BACKEND
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    depends_on:
      stage-static:
        condition: service_completed_successfully
      php-cron:
        condition: service_healthy

  # =========================================================================
  # Edge
  # =========================================================================

  varnish:
    image: varnish:7.5.0
    # Same tuned parameters as the Deployment. Magento sends very large
    # response headers -- the X-Magento-Tags list on a category page -- and the
    # stock 8k limit truncates them into a 503.
    command:
      - "-p"
      - "http_resp_hdr_len=85536"
      - "-p"
      - "http_resp_size=198304"
      - "-p"
      - "workspace_backend=198304"
      - "-s"
      - "malloc,256m"
    volumes:
      - ./k8s/base/config/files/varnish/default.vcl:/etc/varnish/default.vcl:ro
    tmpfs:
      # exec because varnishd JIT-compiles the VCL into a shared object here and
      # loads it; a noexec mount fails at startup with a VCL compilation error
      # that says nothing about mount options.
      #
      # mode=1777 because varnishd drops to an unprivileged user and then cannot
      # create its own working directory under a root-owned tmpfs:
      #
      #   Error: Cannot create working directory '/var/lib/varnish/varnishd':
      #   Permission denied
      #
      # It exits 1 and the restart policy hides it as a crash loop.
      - /var/lib/varnish:exec,mode=1777
    environment:
      # nginx-proxy routes by VIRTUAL_HOST and terminates TLS with the *.test
      # wildcard it already holds as test.crt. No port is published here: the
      # proxy reaches this container over the shared network below, which is
      # what leaves 127.0.0.1:80 free for the kind cluster.
      VIRTUAL_HOST: ${SITE_HOST:?set by scripts/lib.sh}
      VIRTUAL_PORT: "80"
    networks:
      - default
      - proxy
    healthcheck:
      # Varnish answers on 80 as soon as it starts, and answers 503 until a
      # backend passes its own probe. Asking for a real URL through the full
      # chain is what makes "healthy" here mean "the edge can serve" rather
      # than "the port is open".
      #
      # python3 because the varnish image has no curl, no wget and no nc. The
      # Host header is not optional: the backends select on it.
      #
      # IT ASKS FOR THE STOREFRONT, NOT health_check.php, and that is a
      # correction rather than a preference. health_check.php checks that
      # Magento can reach its database and cache; it does not run the front
      # controller. When a changed `system` section in env.php had not been
      # re-imported, Magento answered every storefront request with a 500 --
      # "The configuration file has changed. Run app:config:import" -- while
      # health_check.php went on returning 200 and this container went on
      # reporting itself healthy. A probe that stays green through a total
      # outage is not measuring the thing it is named after.
      #
      # THIS CANNOT PASS BEFORE THE STORE IS INSTALLED, which is deliberate:
      # varnish stays unhealthy from `up` until `make compose-install` finishes.
      # That is why compose-up.sh waits on the data tier only and
      # compose-install.sh does the final wait — the same ordering
      # scripts/deploy.sh uses for the cluster, for the same reason.
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          req = urllib.request.Request("http://localhost/",
                                       headers={"Host": "${SITE_HOST}",
                                                "X-Forwarded-Proto": "https"})
          sys.exit(0 if urllib.request.urlopen(req, timeout=8).status == 200 else 1)
      interval: 10s
      timeout: 8s
      # 6, not 12. Verified by stopping the storefront backend with a cold
      # cache: the probe fails on every check immediately, but the container
      # only reports `unhealthy` once the retries are exhausted -- at 12 that is
      # over two minutes of a broken edge still reporting `starting`. Six is
      # still tolerant of a slow first render and declares in one minute.
      retries: 6
      start_period: 30s
    depends_on:
      web:
        condition: service_healthy
      web-admin:
        condition: service_healthy
      web-cron:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  # =========================================================================
  # Scheduled and queued work
  #
  # Under the old Compose stack cron was run by hand and nothing consumed any
  # queue until somebody noticed. These are real services for the same reason
  # the manifests make them real workloads: work that only happens when
  # remembered does not happen.
  # =========================================================================

  # A mail sink per site, and NOT a published host port. Two sites cannot both
  # bind 172.17.0.1:8025, and the failure is a container that will not start
  # for a reason unrelated to anything either store is doing.
  #
  # It is per-site rather than shared for the same reason the queue vhost is:
  # a password-reset mail from second.test landing in vanilla.test's inbox is
  # exactly the cross-site confusion this design is spending memory to avoid.
  # Measured at 3 MiB, which is the cheapest isolation in the file.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    environment:
      VIRTUAL_HOST: mail.${SITE_HOST:?set by scripts/lib.sh}
      VIRTUAL_PORT: "8025"
    networks:
      - default
      - proxy
    mem_limit: 256m
    restart: unless-stopped

  magento-install:
    # One-shot. Idempotent: installs an empty database, upgrades an installed
    # one. `make compose-install` runs it; nothing starts it automatically,
    # because a schema change should be a decision.
    <<: [*app-image, *app-env, *app-hardening]
    volumes: *app-volumes
    restart: "no"
    command: ["magento-install"]
    profiles: ["install"]
    mem_limit: 4g
    # THE ONE APPLICATION CONTAINER THAT IS NOT READ-ONLY, and it has to be.
    # Magento's installer checks that app/etc, generated/ and pub/static are
    # writable before it will start, and refuses outright:
    #
    #   Missing write permissions to the following paths:
    #   /app/app/etc  /app/generated  /app/pub/static
    #
    # Giving it a writable layer costs nothing that matters. It runs with --rm,
    # so the layer is discarded when it exits, and the only writes that outlive
    # it are the ones going to the volumes above -- the database, pub/media, and
    # env.php in the shared /etc/magento volume. The baked generated/ and
    # pub/static in the image are untouched, and the serving containers stay
    # read-only.
    read_only: false

  magento-cron:
    <<: [*app-image, *app-env, *app-hardening]
    volumes: *app-volumes
    # One loop rather than two, unlike the cluster's two CronJobs: Compose has
    # no scheduler, so the schedule is `cron:run` on an interval inside the
    # container. Magento's own cron_schedule table decides what is actually due,
    # so a one-minute tick does not mean a one-minute reindex.
    command:
      - sh
      - -c
      - |
        set -eu
        while true; do
          php bin/magento cron:run --group=default || true
          php bin/magento cron:run --group=index || true
          sleep 60
        done
    mem_limit: 4g

  consumer-async-operations:
    <<: *consumer
    command: ["php", "bin/magento", "queue:consumers:start", "async.operations.all", "--max-messages=100"]

  consumer-product-action-attribute:
    <<: *consumer
    command: ["php", "bin/magento", "queue:consumers:start", "product_action_attribute.update", "--max-messages=100"]

  consumer-inventory-reservations-update:
    <<: *consumer
    command: ["php", "bin/magento", "queue:consumers:start", "inventory.reservations.update", "--max-messages=100"]

  consumer-inventory-reservations-cleanup:
    <<: *consumer
    command: ["php", "bin/magento", "queue:consumers:start", "inventory.reservations.cleanup", "--max-messages=100"]

  consumer-media-gallery-synchronization:
    <<: *consumer
    command: ["php", "bin/magento", "queue:consumers:start", "media.gallery.synchronization", "--max-messages=100"]

  consumer-codegenerator:
    <<: *consumer
    command: ["php", "bin/magento", "queue:consumers:start", "codegeneratorProcessor", "--max-messages=100"]

networks:
  default:
  # The data tier this site attaches to, by the fixed name its own compose file
  # publishes. External, so `docker compose down` on a site can never take the
  # database of another site with it -- the same reasoning as `proxy` below,
  # and a sharper case: in shared mode that network is several stores' data.
  #
  # WHICH ONE depends on the site's mode, and scripts/lib.sh decides:
  # `magento-data` for a shared site, `magento-data-<slug>` for an exclusive
  # one. The application tier cannot tell the difference and does not need to.
  data:
    name: ${DATA_NETWORK:?set by scripts/lib.sh - run this through make}
    external: true
  proxy:
    # The shared nginx-proxy network, created by the proxy-dns stack rather
    # than by this one. External on purpose: `make compose-down` must never
    # take down the proxy every other .test host on this machine routes
    # through.
    name: ${PROXY_NETWORK:-proxy-dns_default}
    external: true

volumes:
  # pub/media is the one writable application path that genuinely has to be
  # shared -- every other one is either in the image or container-local. Same
  # conclusion the manifests reach with a single ReadWriteOnce claim.
  media:
  # Staged from the application image by stage-static on every `up`.
  pub-static:
