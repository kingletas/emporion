; Magento runtime PHP settings.
;
; memory_limit is -1 rather than a number because bin/magento subcommands
; (di:compile, static-content:deploy, indexer:reindex) each want a different
; ceiling and getting one of them wrong produces an OOM that reads like a code
; defect. The container memory limit is the real bound, and it is set per
; workload in the manifests where it can be justified against measurement.
memory_limit = -1

max_execution_time = 600
max_input_vars = 10000
post_max_size = 1G
upload_max_filesize = 1G
date.timezone = America/Chicago
realpath_cache_size = 10M
realpath_cache_ttl = 7200

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 60000
opcache.save_comments = 1
; The code in the image never changes while a container is alive, which is the
; one genuine benefit an immutable image hands the runtime for free. Correct
; for the prod-shaped overlay and for the Compose stack, and completely wrong
; for the dev overlay, which mounts a live tree over /app -- an edit there would
; never be picked up and the pod would simply look broken. The dev overlay puts
; it back to 1 in its own ini rather than this file relaxing for everyone.
opcache.validate_timestamps = 0
