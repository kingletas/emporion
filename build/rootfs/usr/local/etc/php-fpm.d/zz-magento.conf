; php-fpm pool. Overrides the image's stock www pool.
;
; The two directives that matter here are ping.path and pm.status_path: they
; are what a readiness probe can actually ask. A tcpSocket check on 9000 tells
; you the listener is bound, not that the pool can execute PHP, and the whole
; rule here is that dependencies are expressed as probes rather
; than as startup ordering.

[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = app
group = app
listen = 0.0.0.0:9000

; Static rather than dynamic. On a scheduler, a pool that grows its own worker
; count makes the container's memory limit a function of traffic, and then the
; limit cannot be set from measurement. Fix the worker count,
; measure it, scale by replica instead.
pm = static
pm.max_children = 5
pm.max_requests = 500

ping.path = /ping
ping.response = pong
pm.status_path = /status

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
