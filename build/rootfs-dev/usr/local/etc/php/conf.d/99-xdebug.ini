; Xdebug, installed but inert.
;
; XDEBUG_MODE is read from the environment (default "off" in the image), so a
; single pod can be switched into debug mode without a rebuild:
;   kubectl set env deployment/php-fpm XDEBUG_MODE=debug
;
; It is off by default because loading Xdebug with mode != off costs about 2x
; on every request whether or not a session is attached — start_with_request
; does not avoid that. Any timing taken against a pod with it on is fiction.
xdebug.mode = ${XDEBUG_MODE}
xdebug.start_with_request = trigger
xdebug.client_port = 9003
; On Kubernetes there is no host-gateway alias. The IDE is reached through
; the node's gateway address, which kind maps to the host.
xdebug.client_host = ${XDEBUG_CLIENT_HOST}
xdebug.idekey = VSCODE
xdebug.log = /tmp/xdebug.log
xdebug.log_level = 7
