# Magento cron.
#
# This has no Compose service to translate. It is run by hand inside php-cron
# when someone remembers, and the local environment's cron_schedule is
# routinely 100% missed — which is a dev-box artifact, not an incident, but it
# does mean there is nothing here to port. It has to be designed.
#
# One CronJob per group rather than one CronJob running `cron:run` with no
# group, because the groups have genuinely different profiles: `index` is long
# and CPU-heavy, `default` is short and frequent, and a single job would let
# a reindex block the next twelve minutes of everything else.
#
# concurrencyPolicy: Forbid on both. Magento's cron takes its own locks, so a
# second concurrent run is not a correctness problem — it is a memory problem,
# and this cluster does not have the headroom to find out.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: magento-cron-default
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: magento-cron
            vanilla.dev/cron-group: default
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1001
          containers:
            - name: cron
              image: magento-app:local
              imagePullPolicy: IfNotPresent
              args: ["php", "bin/magento", "cron:run", "--group=default"]
              envFrom:
                - configMapRef:
                    name: vanilla-env
                - secretRef:
                    name: vanilla-app
              volumeMounts:
                - name: var
                  mountPath: /app/var
                - name: env-php
                  mountPath: /etc/magento
                - name: media
                  mountPath: /app/pub/media
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: var
              emptyDir: {}
            - name: env-php
              emptyDir: {}
            - name: media
              persistentVolumeClaim:
                claimName: magento-media
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: magento-cron-index
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: magento-cron
            vanilla.dev/cron-group: index
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1001
          containers:
            - name: cron
              image: magento-app:local
              imagePullPolicy: IfNotPresent
              args: ["php", "bin/magento", "cron:run", "--group=index"]
              envFrom:
                - configMapRef:
                    name: vanilla-env
                - secretRef:
                    name: vanilla-app
              volumeMounts:
                - name: var
                  mountPath: /app/var
                - name: env-php
                  mountPath: /etc/magento
                - name: media
                  mountPath: /app/pub/media
              resources:
                requests:
                  cpu: 200m
                  memory: 384Mi
                limits:
                  memory: 1536Mi
          volumes:
            - name: var
              emptyDir: {}
            - name: env-php
              emptyDir: {}
            - name: media
              persistentVolumeClaim:
                claimName: magento-media
