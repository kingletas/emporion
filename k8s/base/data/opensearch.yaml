# OpenSearch.
#
# The Compose service sets `bootstrap.memory_lock: true` with an unbounded
# memlock ulimit. There is no ulimits: key on Kubernetes — a ulimit is a
# securityContext and sysctl concern, and the unbounded memlock a container
# runtime grants freely is not something a kubelet grants at all by default.
#
# This is one of the places the Compose file expresses something Kubernetes
# deliberately makes harder, so it is worth being explicit rather than quietly
# dropping it: memory_lock is OFF here, and swappiness is handled at the node.
# On a single-node local cluster with a fixed 512 MB heap the JVM has nothing
# to swap out anyway; on anything real, it would be turned back on with a
# securityContext capability and a node that has swap disabled.
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  labels:
    app.kubernetes.io/name: opensearch
spec:
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # This is the one init container in the whole deployment, and it is
        # not a wait — A5 bans those. It sets a kernel parameter the JVM
        # needs before it can start, which is work, not sequencing.
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
            runAsUser: 0
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9600
          env:
            - name: cluster.name
              value: vanilla
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: discovery.type
              value: single-node
            - name: bootstrap.memory_lock
              value: "false"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          # The container limit is deliberately above the heap: a JVM needs
          # off-heap memory for Lucene's mapped files and thread stacks, and a
          # limit set equal to -Xmx is the classic way to get an OOMKill that
          # looks like a search bug.
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1200Mi
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=1s
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
