            claimName: magento-media
---
apiVersion: v1
kind: Service
metadata:
  name: php-cron
  labels:
    app.kubernetes.io/name: php-cron
spec:
  selector:
    app.kubernetes.io/name: php-cron
  ports:
    - name: fastcgi
      port: 9000
      targetPort: fastcgi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-cron
  labels:
    app.kubernetes.io/name: php-cron
    # Also on the Deployment, not only on the pod template. An overlay's
    # patch target selects against the object's own labels, so a selector
    # that exists only under spec.template matches nothing — and matches
    # nothing SILENTLY, which is how a patch can look applied and not be.
    vanilla.dev/pool: background
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: php-cron
  template:
    metadata:
      labels:
        app.kubernetes.io/name: php-cron
        vanilla.dev/pool: background
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: php-fpm
          image: magento-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: fastcgi
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: vanilla-env
            - secretRef:
                name: vanilla-app
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: env-php
              mountPath: /etc/magento
            - name: media
              mountPath: /app/pub/media
          readinessProbe:
            exec:
              command: ["fpm-ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["fpm-ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # 4Gi, and this one IS a measurement rather than a convention.
              # At 1536Mi `bin/magento app:config:import` against the real
              # configuration was OOM-killed by the kernel, and scripts run
              # bin/magento with `-d memory_limit=-1` -- so PHP never raises
              # its own allocation error and the only symptom is
              # `command terminated with exit code 137`. A PHP memory limit
              # inside a container is advisory; the cgroup limit is the real
              # one, and removing the first just moves the failure somewhere
              # far less legible. Compose gives this pool 4g.
              memory: 4Gi
      volumes:
        - name: var
          emptyDir: {}
        - name: env-php
          emptyDir: {}
        - name: media
          persistentVolumeClaim:
            claimName: magento-media
