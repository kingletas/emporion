# Main nginx configuration for the three web pools.
#
# Differences from the Compose version, each deliberate:
#
#   - No TLS. The ingress terminates it. Three separate nginx pools each
#     holding a copy of the mkcert key was a consequence of nginx-proxy's
#     CERT_NAME mechanism, and that mechanism does not survive the move
#     One TLS Secret at the edge replaces six mounted key files.
#   - Listens on 8080, not 80. Nothing here runs as root, and a port below
#     1024 would need a capability the pod does not otherwise want.
#   - Logs to stdout/stderr. A log file inside a pod is lost on replacement
#     and invisible to `kubectl logs`.

worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    # Writable temp paths: the container filesystem is read-only except for
    # an emptyDir at /tmp, so every path nginx writes to has to live under it.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'backend=$upstream_addr rt=$request_time';

    map $status $loggable {
        ~^[23] 0;
        default 1;
    }

    access_log /dev/stdout main if=$loggable;

    gzip on;
    gzip_disable "msie6";
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types text/plain text/css text/js text/xml text/javascript
               application/javascript application/x-javascript application/json
               application/xml application/xml+rss image/svg+xml;
    gzip_vary on;

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 1G;
    client_body_buffer_size 100M;

    include /etc/nginx/conf.d/*.conf;
}
