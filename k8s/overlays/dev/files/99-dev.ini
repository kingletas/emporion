; Development-only PHP overrides. Mounted into conf.d by the dev overlay and
; present in no other mode.
;
; validate_timestamps is the one that matters. The image sets it to 0 because
; the code inside an immutable image never changes — that is the one genuine
; benefit an immutable image hands the runtime for free. With a hostPath
; mount the code changes constantly, and leaving it at 0 means every edit is
; silently ignored until the pod is replaced.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
